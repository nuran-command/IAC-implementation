# Ansible Inventory File
# Replace IP addresses with your actual server IPs

[swarm_manager]
manager1 ansible_host=<MANAGER_IP> ansible_user=ubuntu ansible_ssh_private_key_file=./my-project-key.pem

[swarm_workers]
worker1 ansible_host=<WORKER1_IP> ansible_user=ubuntu ansible_ssh_private_key_file=./my-project-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
