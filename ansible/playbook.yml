---
- name: SRE Infrastructure Setup and Deployment
  hosts: all
  become: yes
  vars:
    project_dir: "/opt/endterm-sre"

  tasks:
    - name: Install required dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
          - python3-docker
          - git
        state: present
        update_cache: yes



    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu bionic stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install docker-compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Remove existing project directory (to ensure fresh clone)
      file:
        path: "{{ project_dir }}"
        state: absent

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'


    - name: Clone project repository
      git:
        repo: 'https://github.com/nuran-command/IAC-implementation.git'
        dest: "{{ project_dir }}"
        version: main
        force: yes

    - name: Initialize Docker Swarm
      docker_swarm:
        state: present
      ignore_errors: yes

    - name: Deploy Docker Stack
      command: docker stack deploy -c {{ project_dir }}/docker-swarm.yml sre_app
      args:
        chdir: "{{ project_dir }}"

