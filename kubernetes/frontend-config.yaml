apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
  namespace: sre-app
data:
  nginx.conf: |
    events {}
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        server {
            listen 80;
            location / {
                root /usr/share/nginx/html;
                index index.html;
                try_files $uri $uri/ /index.html;
            }
            location /api/auth/ {
                rewrite ^/api/auth/(.*) /$1 break;
                proxy_pass http://auth-service:80;
            }
            location /api/users/ {
                rewrite ^/api/users/(.*) /$1 break;
                proxy_pass http://user-profile-service:80;
            }
            location /api/products/ {
                rewrite ^/api/products/(.*) /$1 break;
                proxy_pass http://product-service:80;
            }
            location /api/orders/ {
                rewrite ^/api/orders/(.*) /$1 break;
                proxy_pass http://order-service:80;
            }
            location /api/payment/ {
                rewrite ^/api/payment/(.*) /$1 break;
                proxy_pass http://payment-service:80;
            }
            location /api/notification/ {
                rewrite ^/api/notification/(.*) /$1 break;
                proxy_pass http://notification-service:80;
            }
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SRE Dashboard | Microservices Monitor</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>SRE System Dashboard</h1>
                <p class="subtitle">Real-time microservices monitoring and interaction</p>
            </header>

            <div class="dashboard">
                <div class="card">
                    <div class="card-title">
                        Auth Service
                        <span id="auth-status" class="status-badge checking">Checking</span>
                    </div>
                    <p class="subtitle">Authentication & Authorization</p>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        User Service
                        <span id="user-status" class="status-badge checking">Checking</span>
                    </div>
                    <p class="subtitle">User Profile Management</p>
                </div>

                <div class="card">
                    <div class="card-title">
                        Product Service
                        <span id="product-status" class="status-badge checking">Checking</span>
                    </div>
                    <p class="subtitle">Inventory & Catalog</p>
                </div>

                <div class="card">
                    <div class="card-title">
                        Order Service
                        <span id="order-status" class="status-badge checking">Checking</span>
                    </div>
                    <p class="subtitle">Transaction Processing</p>
                </div>

                <div class="card">
                    <div class="card-title">
                        Payment Service
                        <span id="payment-status" class="status-badge checking">Checking</span>
                    </div>
                    <p class="subtitle">Financial Transactions</p>
                </div>

                <div class="card">
                    <div class="card-title">
                        Notification Service
                        <span id="notification-status" class="status-badge checking">Checking</span>
                    </div>
                    <p class="subtitle">Alerts & Messaging</p>
                </div>
            </div>

            <div class="actions-panel">
                <h2>System Actions</h2>
                <p class="subtitle" style="margin-bottom: 20px;">Test the load balanced order service</p>
                <button onclick="placeOrder()">Simulate Order Placement</button>
                <p id="order-msg"></p>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
    </html>

  styles.css: |
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }

    .status-badge.checking {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .actions-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .actions-panel h2 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    button {
      background: linear-gradient(to right, #3b82f6, #6366f1);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    #order-msg {
      margin-top: 15px;
      font-size: 0.95rem;
      min-height: 20px;
      font-weight: 600;
    }

  app.js: |
    const services = [
        { id: 'auth', endpoint: '/api/auth/' },
        { id: 'user', endpoint: '/api/users/' },
        { id: 'product', endpoint: '/api/products/' },
        { id: 'order', endpoint: '/api/orders/' },
        { id: 'payment', endpoint: '/api/payment/' },
        { id: 'notification', endpoint: '/api/notification/' }
    ];

    async function checkStatus() {
        for (const service of services) {
            const badge = document.getElementById(`${service.id}-status`);
            if (!badge) continue;
            try {
                const res = await fetch(service.endpoint);
                if (res.ok) {
                    updateBadge(badge, 'online');
                } else {
                    updateBadge(badge, 'offline');
                }
            } catch (e) {
                updateBadge(badge, 'offline');
            }
        }
    }

    function updateBadge(element, status) {
        element.className = `status-badge ${status}`;
        element.innerText = status;
    }

    async function placeOrder() {
        const msg = document.getElementById('order-msg');
        msg.style.color = 'var(--text-secondary)';
        msg.innerText = "Processing order...";
        
        try {
            const res = await fetch('/api/orders/');
            
            if (!res.ok) {
                msg.style.color = 'var(--error)';
                msg.innerText = "Order Failed: Service returned an error";
            } else {
                msg.style.color = 'var(--success)';
                msg.innerText = "Order Placed Successfully!";
            }
        } catch (e) {
            msg.style.color = 'var(--error)';
            msg.innerText = "Order Failed: Service unreachable";
        }
        
        checkStatus();
    }

    checkStatus();
    setInterval(checkStatus, 5000);
