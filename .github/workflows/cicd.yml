name: "CI/CD SRE Enterprise Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    name: "Linting & Config Validation"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.9"
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: "Install Linting Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: "Lint Python Code"
        run: |
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "Validate Service Configurations"
        run: |
          cp .env.example .env
          python3 scripts/validate_config.py

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: "Terraform Format & Validation Check"
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: "Setup Ansible"
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: "Ansible Syntax Validation"
        run: |
          ansible-playbook --syntax-check ansible/playbook.yml
          ansible-playbook --syntax-check ansible/monitoring.yml
          ansible-playbook --syntax-check ansible/kubernetes.yml

  unit-tests:
    name: "Microservices Unit Testing"
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.9"
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: "Install Test Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx

      - name: "Run Unit Tests"
        run: |
          cd services/auth-service && pytest -v
          cd ../user-profile-service && pytest -v
          cd ../product-service && pytest -v
          cd ../order-service && pytest -v
          cd ../payment-service && pytest -v
          cd ../notification-service && pytest -v

  docker-build:
    name: "Container Build Validation"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Validate Docker Compose"
        run: |
          docker compose config

  continuous-deployment:
    name: "Deploy to AWS EC2"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Deploy to EC2 via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/IAC-implementation
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker system prune -f

      - name: "Verify Deployment Health"
        run: |
          echo "Deployment finished successfully"