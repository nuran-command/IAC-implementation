name: "CI/CD SRE Enterprise Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── JOB 1: LINT & CONFIG VALIDATION ──────────────────────────────────────────
  lint-and-validate:
    name: "🎨 Linting & Config Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.9"
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'
        continue-on-error: true

      - name: "📦 Install Linting Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: "🔍 Lint Python Code (PEP8)"
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: "⚙️ Validate Custom Service Configurations"
        run: |
          # Copy env example to .env to satisfy validation script
          cp .env.example .env
          python3 scripts/validate_config.py

      - name: "☁️ Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: "🏗️ Terraform Format & Validation Check"
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: "🛡️ Setup Ansible"
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: "📝 Ansible Syntax Validation"
        run: |
          ansible-playbook --syntax-check ansible/playbook.yml
          ansible-playbook --syntax-check ansible/monitoring.yml
          ansible-playbook --syntax-check ansible/kubernetes.yml

  # ── JOB 2: AUTOMATED UNIT TESTING ────────────────────────────────────────────
  unit-tests:
    name: "🧪 Microservices Unit Testing"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.9"
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: "📦 Install Test Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx

      - name: "🚀 Run Unit Tests (auth-service)"
        run: |
          cd services/auth-service
          pytest -v

      - name: "🚀 Run Unit Tests (user-profile-service)"
        run: |
          cd services/user-profile-service
          pytest -v

      - name: "🚀 Run Unit Tests (product-service)"
        run: |
          cd services/product-service
          pytest -v

      - name: "🚀 Run Unit Tests (order-service)"
        run: |
          cd services/order-service
          pytest -v

      - name: "🚀 Run Unit Tests (payment-service)"
        run: |
          cd services/payment-service
          pytest -v

      - name: "🚀 Run Unit Tests (notification-service)"
        run: |
          cd services/notification-service
          pytest -v

  # ── JOB 3: CONTAINER INTEGRITY BUILD ──────────────────────────────────────────
  docker-build:
    name: "🐳 Container Build Validation"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🏗️ Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🛠️ Dry-run Docker Stack Build"
        run: |
          # Since uvicorn-gunicorn-fastapi base image is used directly with volumes in Swarm/Compose,
          # we check if compose configurations compile successfully.
          docker compose config

  # ── JOB 4: CONTINUOUS DEPLOYMENT (CD) ─────────────────────────────────────────
  continuous-deployment:
    name: "🚀 Automated Swarm/K8s CD & Verification"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "📡 Simulate Infrastructure Deploy"
        run: |
          echo "================================================================"
          echo "CI/CD Pipeline triggering Automated Deployment to AWS Clusters!"
          echo "Applying Terraform-allocated resources and Ansible playbooks..."
          echo "================================================================"
          echo "Terraform provision check: SUCCESS"
          echo "Ansible playbook execution check: SUCCESS"
          echo "Kubernetes deployment check: SUCCESS"
          echo "All services successfully rolled out with zero-downtime strategy."

      - name: "🩺 Verify Deployment Health"
        run: |
          # Dry run health check simulation of local system configuration
          echo "Starting service health validation..."
          bash -c "exit 0"
